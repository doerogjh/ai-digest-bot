[project]
name = "ai-digest-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
ai-digest-bot = "ai_digest_bot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

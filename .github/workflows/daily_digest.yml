name: Daily IT & GitHub Digest

on:
  schedule:
    # Запуск каждый день в 06:00 UTC (09:00 МСК / 08:00 Киев)
    - cron: '0 6 * * *'
  workflow_dispatch: # Кнопка для ручного запуска в интерфейсе GitHub в любой момент

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 aiosqlite python-dotenv google-genai

      - name: Run Digest and Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python send_digest.py

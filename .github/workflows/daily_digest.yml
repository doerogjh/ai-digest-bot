name: Daily IT & GitHub Digest

on:
  schedule:
    # Запуск каждое утро в 06:00 UTC (09:00 по Москве / Киеву)
    - cron: '0 6 * * *'
  workflow_dispatch: # Возможность запустить вручную в любое время через интерфейс GitHub

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install aiogram aiosqlite httpx beautifulsoup4 google-genai python-dotenv rich

      - name: Запуск сбора новостей и обновления памяти
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import asyncio
          from scraper import fetch_all_categories
          import database
          async def sync():
              await database.init_db()
              print('🔄 Сбор свежих репозиториев по 5 темам...')
              data = await fetch_all_categories()
              total = 0
              for cat, repos in data.items():
                  cnt = await database.save_repos(repos, cat)
                  total += cnt
              stats = await database.get_stats()
              print(f'✅ Успешно! Собрано: {total}, всего в памяти: {stats[\"total_repos\"]}')
          asyncio.run(sync())
          "
